}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;

}

  color-scheme:dark;
  --bg:#101A1D;--surface:#18252A;--ink:#E3ECEA;--muted:#9AABAF;--line:#2C3D42;--head:#1F3036;

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55}
main{max-width:1500px;margin:0 auto;padding:28px 20px 60px}

.lede{max-width:72ch;color:var(--muted);margin:0 0 22px}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;padding:9px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible,.chip:focus-visible,.paper:focus-visible{outline:3px solid var(--k-ai);outline-offset:2px}
.flow{max-width:80ch;margin:0 0 18px;padding:14px 16px;background:var(--surface);border-radius:10px;border:1px solid var(--line)}
.flow p{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.legend .hint{color:var(--muted);font-size:13px;margin-right:4px}
.chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.38;text-decoration:line-through}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left}
thead th{position:sticky;top:0;background:var(--head);font-weight:600;font-size:14px;padding:10px 10px;z-index:2;white-space:nowrap}
tbody th{position:sticky;left:0;background:var(--head);z-index:1;width:150px;min-width:150px;padding:12px 12px;font-size:14px;font-weight:600;line-height:1.35}
tbody th small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:4px}
thead th:first-child{left:0;z-index:3}
td{padding:8px;min-width:178px;width:178px}
td.empty{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 35%,transparent) 8px 9px)}
.paper{display:block;text-decoration:none;color:var(--ink);background:var(--bg);border-left:4px solid var(--c);border-radius:4px;padding:7px 9px 8px;margin-bottom:7px}
.paper:last-child{margin-bottom:0}
.paper:hover .t{text-decoration:underline}
.paper .t{display:block;font-weight:600;font-size:13.5px;line-height:1.3}
.paper .n{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.paper .v{display:block;font-size:12px;font-weight:600;color:var(--c);margin-top:4px}
.paper .s{font-weight:500;font-size:11px;border:1px solid var(--muted);color:var(--muted);border-radius:3px;padding:0 4px;margin-left:5px}
.paper[hidden]{display:none}
footer{margin-top:22px;color:var(--muted);font-size:13px;max-width:80ch}
footer p{margin:0 0 6px}
@media (max-width:640px){
  main{padding:20px 12px 40px}
  tbody th{width:112px;min-width:112px;font-size:13px}
  td{min-width:160px;width:160px}
}
</style>
</head>

<main>
  <h1>월드 모델과 에이전트 논문 지도</h1>
  <p class="lede">가로축은 연도, 세로축은 연구 흐름입니다. 논문 이름을 누르면 원문으로 이동하고, ‘검색’ 표시가 붙은 논문은 원문 링크를 확인하지 못해 Google Scholar 검색으로 연결됩니다. 학회 종류 버튼을 눌러 특정 베뉴만 골라 볼 수 있습니다.</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-general" aria-controls="panel" data-view="general">일반 AI</button>
    <button class="tab" role="tab" id="tab-surgical" aria-controls="panel" data-view="surgical">수술과 의료 AI</button>
  </div>

  <div id="panel" role="tabpanel">
    <div class="flow"><p id="flow"></p></div>
    <div class="legend" id="legend"><span class="hint">베뉴 종류</span></div>
    <div class="scroller"><table id="matrix"></table></div>
  </div>

  <footer>
    <p>연도는 학회나 저널에 실린 해를 기준으로 하고, 아직 정식 출판 정보가 없는 논문은 arXiv 공개 연도로 넣었습니다.</p>
    <p>2026년 10월 기준으로 조사했으며, 2026년 arXiv 논문 중 다수는 아직 심사 중일 수 있습니다.</p>
  </footer>
</main>

const scholar = q => "https://scholar.google.com/scholar?q=" + encodeURIComponent(q);
const active = new Set(Object.keys(KINDS));
let view = "general";

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const V = VIEWS[view];
  document.getElementById("flow").textContent = V.flow;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.view===view ? "true":"false"));
  let h = "<thead><tr><th scope='col'>카테고리 \\ 연도</th>" + V.years.map(y=>"<th scope='col'>"+y+"</th>").join("") + "</tr></thead><tbody>";
  for(const row of V.rows){
    h += "<tr><th scope='row'>"+esc(row.name)+"<small>"+esc(row.sub)+"</small></th>";
    for(const y of V.years){
      const ps = V.papers.filter(p=>p.r===row.id && p.y===y);
      if(!ps.length){h += "<td class='empty'></td>"; continue;}
      h += "<td>" + ps.map(p=>{
        const url = p.u || scholar(p.q || p.t);
        return "<a class='paper' data-k='"+p.k+"' style='--c:var("+KINDS[p.k].c+")' href='"+esc(url)+"' target='_blank' rel='noopener'>"
          + "<span class='t'>"+esc(p.t)+(p.s?"<span class='s'>검색</span>":"")+"</span>"
          + "<span class='n'>"+esc(p.n)+"</span>"
          + "<span class='v'>"+esc(p.v)+"</span></a>";
      }).join("") + "</td>";
    }
    h += "</tr>";
  }
  document.getElementById("matrix").innerHTML = h + "</tbody>";
  buildLegend();
  applyFilter();
}

function buildLegend(){
  const V = VIEWS[view];
  const used = [...new Set(V.papers.map(p=>p.k))];
  const lg = document.getElementById("legend");
  lg.innerHTML = "<span class='hint'>베뉴 종류</span>";
  Object.keys(KINDS).filter(k=>used.includes(k)).forEach(k=>{
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.k = k;
    b.setAttribute("aria-pressed", active.has(k) ? "true":"false");
    b.style.setProperty("--c","var("+KINDS[k].c+")");
    b.innerHTML = "<i></i>"+KINDS[k].label;
    b.addEventListener("click",()=>{ active.has(k)?active.delete(k):active.add(k); b.setAttribute("aria-pressed", active.has(k)?"true":"false"); applyFilter(); });
    lg.appendChild(b);
  });
  const c = document.createElement("span"); c.className="count"; c.id="count"; lg.appendChild(c);
}

function applyFilter(){
  let shown = 0, total = 0;
  document.querySelectorAll(".paper").forEach(a=>{ total++; const on = active.has(a.dataset.k); a.hidden = !on; if(on) shown++; });
  document.getElementById("count").textContent = "논문 " + shown + "편 표시 중 (전체 " + total + "편)";
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ view=b.dataset.view; history.replaceState(null,"","#"+view); render(); }));
const start = (location.hash||"").slice(1);
if(VIEWS[start]) view = start;
render();
</script>
