<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EEF2F1;--surface:#FFFFFF;--ink:#16262B;--muted:#5B6B70;--line:#CBD5D3;--accent:#0B8576;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#101A1D;--surface:#18252A;--ink:#E3ECEA;--muted:#9AABAF;--line:#2C3D42;--accent:#3FC9B5}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#101A1D;--surface:#18252A;--ink:#E3ECEA;--muted:#9AABAF;--line:#2C3D42;--accent:#3FC9B5}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.55;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:640px;padding:40px 20px}
h1{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-0.02em;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 28px}
.btn{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:20px 22px;transition:transform .15s ease,border-color .15s ease}
.btn+.btn{margin-top:14px}
.btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn .t{display:block;font-size:19px;font-weight:600}
.btn .d{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.btn .go{display:inline-block;margin-top:12px;font-weight:600;font-size:14px;color:var(--accent)}
.home{display:inline-block;margin-top:28px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
</style>
</head>
<body>
<main>
  <h1>Research</h1>
  <p class="lede">공부하면서 정리한 연구 자료를 모아둔 곳입니다.</p>
  <a class="btn" href="./world-model-agent/">
    <span class="t">월드 모델과 에이전트 논문 지도</span>
    <span class="d">연도와 연구 흐름으로 정리한 130편. 일반 AI와 수술, 의료 AI 두 갈래로 볼 수 있습니다.</span>
    <span class="go">지도 열기</span>
  </a>
  <a class="btn" href="./operating-room/">
    <span class="t">Operating Room AI 논문 지도</span>
    <span class="d">수술실 공간을 카메라와 센서로 이해하는 AI 연구 75편. 지정 베뉴와 프리프린트 두 갈래로 볼 수 있습니다.</span>
    <span class="go">지도 열기</span>
  </a>
  <a class="home" href="/">홈으로 돌아가기</a>
</main>
</body>
</html>
