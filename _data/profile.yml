# Paragraphs. HTML allowed.
bio:
  - >-
    I am a Ph.D. student at the
    <a href="https://www.tum.de/en/">Technical University of Munich (TUM)</a>, advised by Prof.
    <a href="https://www.cs.cit.tum.de/camp/">Nassir Navab</a> at the Chair for
    <a href="https://www.cs.cit.tum.de/camp/">Computer Aided Medical Procedures (CAMP)</a>.
    My research focuses on AI in healthcare, particularly computer vision methods
    for understanding and assisting laparoscopic and robotic surgery.
  - >-
    Before joining TUM, I received my M.S. from
    <a href="https://www.khu.ac.kr/eng/user/main/view.do">Kyung Hee University</a> under Prof.
    <a href="https://ami.khu.ac.kr/people/pi/">Seong Tae Kim</a> in the
    <a href="https://ami.khu.ac.kr/">AugMented Intelligence (AMI) Laboratory</a>.
    I am especially interested in enabling AI to understand surgical scenes and to interact
    with the people in the operating room. My recent work covers surgical scene graphs,
    concept-based explanations of surgical phase recognition, and benchmarks that test
    whether vision-language models really look at the surgical image.

